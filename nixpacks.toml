[phases.build]
# Jangan jalankan cache:clear di fase build: store default "database"
# belum tentu bisa diakses saat image dibangun.
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan view:clear",
    "php artisan config:clear"
]

[start]
# Jalankan migrasi + optimize:clear sebelum server menyala.
# Script yang sama dipakai oleh Dockerfile/railway.json agar konsisten.
cmd = "sh docker/start.sh"
